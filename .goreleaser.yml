version: 2
project_name: heimdall

# Build the Swift audio capture helper before packaging. GoReleaser only builds
# the Go binary; without this hook the heimdall-audio helper would be missing
# from every release tarball, breaking system-audio capture at runtime.
# The universal (arm64 + x86_64) fat binary is bundled into both arch archives.
before:
  hooks:
    - make audio-helper-universal

builds:
  - id: heimdall
    main: ./cmd/heimdall
    binary: heimdall
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    files:
      - LICENSE
      - README.md
      - src: bin/heimdall-audio
        dst: heimdall-audio
        info:
          mode: 0755

checksum:
  name_template: 'checksums.txt'

# Requires a one-time manual setup: create the (empty) tap repository at
# github.com/0merUfuk/homebrew-heimdall, and add a repo secret named
# HOMEBREW_TAP_TOKEN holding a PAT with contents:write on that repo -- the
# default GITHUB_TOKEN in Actions is scoped only to the heimdall repo itself
# and cannot push to a different repository. See docs/RELEASING.md.
#
# Uses homebrew_casks (not the deprecated `brews`, see
# https://goreleaser.com/deprecations#brews): casks install pre-compiled
# binaries directly rather than generating a source-build formula, which is
# the right fit since GoReleaser already produces the darwin/amd64+arm64
# binaries. The xattr post-install hook is required because these binaries
# are not code-signed/notarized (no Apple Developer account configured yet) --
# without it, Gatekeeper blocks first launch. Revisit once signing is set up.
homebrew_casks:
  - name: heimdall
    # Gracefully no-op until the one-time setup above is done, instead of
    # failing the whole release: an unset HOMEBREW_TAP_TOKEN means the tap
    # repo/secret aren't provisioned yet. GoReleaser still writes the cask
    # file under dist/homebrew/ either way -- just doesn't try to push it.
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_TOKEN" }}false{{ else }}true{{ end }}'
    binaries:
      - heimdall
      - heimdall-audio
    repository:
      owner: 0merUfuk
      name: homebrew-heimdall
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/0merUfuk/heimdall"
    description: "CLI meeting companion -- captures audio, transcribes with speaker diarization, analyzes via Claude, and writes structured notes to Obsidian"
    caveats: |
      heimdall requires a Deepgram API key (transcription) and, optionally, an
      Anthropic API key (meeting analysis) or an existing `claude` CLI login.
      Run `heimdall config init` to get started, then `heimdall doctor` to
      verify your setup.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/heimdall"]
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/heimdall-audio"]
          end

changelog:
  sort: asc
  filters:
    exclude:
      - '^chore:'
      - '^docs:'

release:
  github:
    owner: 0merUfuk
    name: heimdall
