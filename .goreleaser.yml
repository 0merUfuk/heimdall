version: 2
project_name: heimdall

# Build the Swift audio capture helper before packaging. GoReleaser only builds
# the Go binary; without this hook the heimdall-audio helper would be missing
# from every release tarball, breaking system-audio capture at runtime.
# The universal (arm64 + x86_64) fat binary is bundled into both arch archives.
before:
  hooks:
    - make audio-helper-universal

builds:
  - id: heimdall
    main: ./cmd/heimdall
    binary: heimdall
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    files:
      - LICENSE
      - README.md
      - src: bin/heimdall-audio
        dst: heimdall-audio
        info:
          mode: 0755

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^chore:'
      - '^docs:'

release:
  github:
    owner: 0merUfuk
    name: heimdall
