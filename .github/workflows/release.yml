name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    # macOS is required: CGO/malgo for the mic, and the Swift toolchain for
    # the heimdall-audio Core Audio Taps helper. Neither builds on Linux.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          check-latest: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Repo-scoped PAT for pushing the cask to the homebrew-heimdall tap
          # (GITHUB_TOKEN above cannot write to a different repository).
          # One-time setup required before this step succeeds -- see
          # docs/RELEASING.md.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
