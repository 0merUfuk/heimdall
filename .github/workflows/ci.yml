name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    # macOS is required: CGO/malgo for the mic, and the Swift toolchain for the
    # heimdall-audio Core Audio Taps helper. Neither builds on Linux.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.10'
          check-latest: true

      - name: Build (heimdall + heimdall-audio)
        run: make build

      - name: Test (race)
        run: go test ./... -race -count=1

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Vulnerability scan
        run: govulncheck ./...
